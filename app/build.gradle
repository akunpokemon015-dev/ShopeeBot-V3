plugins {
id 'com.android.application'
}

android {
namespace 'com.example.shopeewarbot'
compileSdk 35

defaultConfig {
    applicationId 'com.example.shopeewarbot'
    minSdk 23
    targetSdk 35
    versionCode 3
    versionName '3.0'
}

compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
}

}

dependencies {
implementation 'androidx.core:core:1.15.0'
}
